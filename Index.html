        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="${origem}">VOLTAR</button>
            <div class="hdr-info"><h1>RELATORIO DE FECHAMENTO</h1><div class="sub">${escapeHtml(formatarChave(chave))}</div></div>
        </div>
        <div class="scroll">
            <div class="small-note">${_fmtDataBr(ini)} — ${_fmtDataBr(fim)}</div>
            ${renderSectionHeader("ENTRADAS", "var(--green)".replace("var(--green)","rgb(33,196,94)"))}
            <div class="card">${blocoEnt}</div>

    config() {
        const svc = App.svc;

            <div class="fixed-row ${corClass === "green" ? "bg-fixo-ent" : "bg-fixo-sai"}">

        let entradasHtml = "";
        for (const fx of ENTRADAS_FIXAS) {
            const inst = svc.dados.entries.find(e => e.fixed_id === fx.fixed_id && dataParaChave(e.date) === chave);
            if (inst) entradasHtml += rowFixo(inst, "green");
        }
        let despesasHtml = "";
        for (const fx of DESPESAS_FIXAS) {
            const inst = svc.dados.entries.find(e => e.fixed_id === fx.fixed_id && dataParaChave(e.date) === chave);
            if (inst) despesasHtml += rowFixo(inst, "red");

        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="home">VOLTAR</button>
            <h1>CONFIGURACOES</h1>
        </div>
        <div class="scroll">
            <div class="small-note">Registros fixos mensais — editaveis abaixo.</div>
            ${renderSectionHeader("ENTRADAS FIXAS", "rgb(33,196,94)")}
            ${entradasHtml}
            ${renderSectionHeader("DESPESAS FIXAS", "rgb(240,69,69)")}
            ${despesasHtml}
            <div class="info-box" style="margin-top:8px">Alteracoes valem a partir do proximo mes.</div>
        </div>
        ${renderNavBar("")}`;
    },

    pdf() {
        const svc = App.svc;
        const chaves = [...svc.chavesComMovimentacao()].sort().reverse();
        const pastaInfo = BackupService.pastaSelecionada()
            ? `Pasta selecionada: ${escapeHtml(BackupService.pastaSelecionada())}/PDFs`
            : (BackupService.supportsFS()
                ? `Nenhuma pasta selecionada — os PDFs serao baixados pelo navegador. <button data-action="escolherPastaPdf" style="margin-top:6px" class="btn btn-small btn-accent2">Escolher pasta</button>`
                : `Os PDFs serao baixados pelo navegador (File System Access API indisponivel).`);

        let lista = "";
        if (!chaves.length) {
            lista = `<div class="muted-msg">Nenhum lancamento registrado.</div>`;
        } else {
            lista += `<div class="small-note" style="margin-bottom:6px">Selecione o mes para gerar o PDF:</div>`;
            for (const chave of chaves) {
                const [, , sal] = svc.calculateBalance(chave, true);
                const cor = sal >= 0 ? "var(--green)" : "var(--red)";
                lista += `
                <div class="pdf-item">
                    <div class="info">
                        <div class="mes">${escapeHtml(formatarChave(chave))}</div>
                        <div class="saldo" style="color:${cor}">Saldo: ${formatarMoeda(sal)}</div>
                    </div>
                    <button data-action="gerar-pdf" data-chave="${chave}">Gerar PDF</button>
                </div>`;
            }
        }

        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="home">VOLTAR</button>
            <h1>GERAR PDF</h1>
        </div>
        <div class="scroll">
            <div class="info-box">${pastaInfo}</div>
            ${lista}
        </div>
        ${renderNavBar("pdf")}`;
    },

    async gerarPDF(chave) {
        try {
            const pdfSvc = new PDFService();
            const { geral, dep } = pdfSvc.exportarRelatorios(App.svc, chave);

            const salvarUm = async (resultado) => {
                const blob = resultado.doc.output("blob");
                if (BackupService.pdfsHandle) {
                    try {
                        const fh = await BackupService.pdfsHandle.getFileHandle(resultado.filename, { create: true });
                        const w = await fh.createWritable();
                        await w.write(blob);
                        await w.close();
                        return "filesystem";
                    } catch (e) {
                        console.warn("Falha ao salvar PDF via File System Access API:", e);
                    }
                }
                BackupService.downloadFallback(resultado.filename, blob, "application/pdf");
                return "download";
            };

            const m1 = await salvarUm(geral);
            const m2 = await salvarUm(dep);
            const destino = m1 === "filesystem" ? `${BackupService.pastaSelecionada()}/PDFs` : "downloads do navegador";
            Toast.ok(`PDFs gerados:\n${geral.filename}\n${dep.filename}\n\nSalvos em: ${destino}`);
        } catch (ex) {
            console.error(ex);
            Toast.erro("Erro ao gerar PDF: " + ex.message);
        }
    },
});

function _ensureModalRoot() {
    let root = document.getElementById("modal-root");
    if (!root) {
        root = document.createElement("div");
        root.id = "modal-root";
        document.body.appendChild(root);
    }
    return root;
}

function openModal(innerHtml, { onOpen } = {}) {
    const root = _ensureModalRoot();
    root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">${innerHtml}</div>
    </div>`;
    const overlay = document.getElementById("modal-overlay");
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) closeModal(); });
    if (onOpen) onOpen(root);
    document.querySelectorAll(".valor-input").forEach(attachValorMask);
    document.querySelectorAll(".data-input").forEach(attachDataMask);
}

function closeModal() {
    const root = document.getElementById("modal-root");
    if (root) root.innerHTML = "";
}

        <div class="modal-scroll">

            <div class="btn-row">
                <button class="btn btn-border" id="btn-cancelar">Cancelar</button>
                <button class="btn" style="background:rgb(140,71,10)" id="btn-restaurar">Restaurar</button>
            </div>
        </div>`, {
            onOpen: () => {
                document.getElementById("btn-cancelar").onclick = () => Modals.cloudRestoreList();
                document.getElementById("btn-restaurar").onclick = async () => {
                    const res = await CloudService.restoreVersion(id);
                    closeModal();
                    if (res.ok) {
                        App.svc = new FinanceService(DataStore.load());
                        Toast.ok("Backup da nuvem restaurado.");
                        App.refreshCurrent();
                    } else {
                        Toast.erro(res.error || "Falha ao restaurar da nuvem.");
                    }
                };
            }
        });
    },

    confirmaRestoreLocal(filename) {
        openModal(`
        <div class="modal-hdr" style="color:var(--orange)">Confirmar restauracao?</div>
        <div class="separador" style="background:var(--orange)"></div>
        <div class="modal-scroll">
            <div class="small-note" style="margin-bottom:10px">Backup: ${escapeHtml(BackupService.nomeCurto(filename))}<br>Dados atuais serao SUBSTITUIDOS.</div>
            <div class="btn-row">
                <button class="btn btn-border" id="btn-cancelar">Cancelar</button>
                <button class="btn" style="background:rgb(140,71,10)" id="btn-restaurar">Restaurar</button>
            </div>
        </div>`, {
            onOpen: () => {
                document.getElementById("btn-cancelar").onclick = closeModal;
                document.getElementById("btn-restaurar").onclick = async () => {
                    const res = await BackupService.restaurarLocal(filename);
                    closeModal();
                    if (res.ok) {
                        App.svc = new FinanceService(DataStore.load());
                        Toast.ok("Backup restaurado."); App.refreshCurrent();
                    } else {
                        Toast.erro(res.error || "Falha ao restaurar.");
                    }
                };
            }
        });
    },

    confirmaRestoreArquivo(file) {
        openModal(`
        <div class="modal-hdr" style="color:var(--orange)">Confirmar restauracao?</div>
        <div class="separador" style="background:var(--orange)"></div>
        <div class="modal-scroll">
            <div class="small-note" style="margin-bottom:10px">Arquivo: ${escapeHtml(file.name)}<br>Dados atuais serao SUBSTITUIDOS (apenas se o arquivo for valido).</div>
            <div class="btn-row">
                <button class="btn btn-border" id="btn-cancelar">Cancelar</button>
                <button class="btn" style="background:rgb(140,71,10)" id="btn-restaurar">Restaurar</button>
            </div>
        </div>`, {
            onOpen: () => {
                document.getElementById("btn-cancelar").onclick = closeModal;
                document.getElementById("btn-restaurar").onclick = async () => {
                    const res = await BackupService.restaurarDeArquivo(file);
                    closeModal();
                    if (res.ok) {
                        App.svc = new FinanceService(DataStore.load());
                        Toast.ok("Backup restaurado."); App.refreshCurrent();
                    } else {
                        Toast.erro(res.error || "Falha ao restaurar. Dados atuais mantidos.");
                    }
                };
            }
        });
    },

    async escolherPastaPdf() {
        const res = await BackupService.escolherPasta();
        if (res.ok) { Toast.ok(`Pasta selecionada: ${res.name}`); App.refreshCurrent(); }
        else Toast.erro(res.error || "Nao foi possivel selecionar a pasta.");
    },
};

// ── Atualiza contagem de backups exibida no painel da Home ────────────────
(function pollBackupCount() {
    setInterval(async () => {
        const note = document.getElementById("backup-count-note");
        if (!note) return;
        try {
            const list = await BackupService.listarBackups();
            note.textContent = list.length ? `  ${list.length} backup(s) disponivel(is)` : "  Nenhum backup criado";
        } catch (e) { /* ignore */ }
    }, 1000);
})();

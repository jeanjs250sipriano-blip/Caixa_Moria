// ══════════════════════════════════════════════════════════════════════════
// DATA.JS — DataStore: camada central de persistência (IndexedDB)
//
// Estrutura lógica preservada (igual ao JSON original do Python):
//   { "entries": [...], "cultos_edicoes": {...} }
//
// Internamente guardamos essa estrutura completa em UM registro dentro de
// um object store "state" (chave fixa "app"). Isso é uma escolha deliberada:
// o app original também grava/lê o JSON inteiro de uma vez a cada operação
// (save_data() reescreve o arquivo completo), então usar um único registro
// atômico no IndexedDB preserva o mesmo comportamento efetivo, com a
// vantagem de leitura/escrita atômica e sem corrupção parcial.
//
// API pública:
//   await DataStore.init()
//   DataStore.load() -> objeto {entries, cultos_edicoes} (já em memória)
//   await DataStore.save()               -> persiste o estado atual
//   DataStore.exportJSON()               -> string JSON (formato compatível)
//   await DataStore.importJSON(str)      -> {ok, error, data}
//   DataStore.validateBackup(obj)        -> {ok, error}
//   await DataStore.replaceData(novoObj) -> substitui tudo (com backup prévio)
//   await DataStore.mergeData(novoObj)   -> mescla (usado internamente se necessário)
// ══════════════════════════════════════════════════════════════════════════

const DataStore = (function () {
    const DB_NAME = "CaixaMoriahDB";
    const DB_VERSION = 1;
    const STORE_STATE = "state";     // guarda o blob {entries, cultos_edicoes}
    const STORE_BACKUPS = "backups"; // backups manuais guardados localmente também

    let _db = null;
    let _dados = { entries: [], cultos_edicoes: {} };

    function _openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (ev) => {
                const db = ev.target.result;
                if (!db.objectStoreNames.contains(STORE_STATE)) {
                    db.createObjectStore(STORE_STATE, { keyPath: "id" });
                }
                if (!db.objectStoreNames.contains(STORE_BACKUPS)) {
                    db.createObjectStore(STORE_BACKUPS, { keyPath: "filename" });
                }
            };
            req.onsuccess = (ev) => resolve(ev.target.result);
            req.onerror = (ev) => reject(ev.target.error);
        });
    }

    function _tx(storeName, mode) {
        return _db.transaction(storeName, mode).objectStore(storeName);
    }

    function _getState() {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_STATE, "readonly");
            const req = store.get("app");
            req.onsuccess = () => resolve(req.result ? req.result.data : null);
            req.onerror = () => reject(req.error);
        });
    }

    function _putState(dataObj) {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_STATE, "readwrite");
            const req = store.put({ id: "app", data: dataObj });
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    }

    async function init() {
        _db = await _openDB();
        const existing = await _getState();
        if (existing && typeof existing === "object") {
            _dados = existing;
            if (!Array.isArray(_dados.entries)) _dados.entries = [];
            if (!_dados.cultos_edicoes) _dados.cultos_edicoes = {};
        } else {
            _dados = { entries: [], cultos_edicoes: {} };
            await _putState(_dados);
        }
        return _dados;
    }

    function load() {
        return _dados;
    }

    async function save() {
        try {
            await _putState(_dados);
            // Backup automático na nuvem (só se estiver ligada nesta sessão)
            try {
                if (typeof CloudService !== "undefined") CloudService.scheduleSync();
            } catch (e) { /* cloud opcional */ }
            return true;
        } catch (e) {
            console.error("Erro ao salvar:", e);
            return false;
        }
    }

    function exportJSON() {
        // Formato compatível com o backup do sistema Python original:
        // topo { entries, cultos_edicoes } — mas embrulhamos com metadados
        // de versão para permitir futuras migrações (ver seção 42 do prompt).
        const payload = {
            backup_version: 1,
            app: "Caixa Moriah",
            created_at: new Date().toISOString(),
            data: {
                entries: _dados.entries,
                cultos_edicoes: _dados.cultos_edicoes,
            },
        };
        return JSON.stringify(payload, null, 2);
    }

    function _extractLegacyOrWrapped(parsed) {
        // Aceita tanto o formato antigo puro (Python):
        //   { "entries": [...], "cultos_edicoes": {...} }
        // quanto o novo formato com envelope:
        //   { backup_version, app, created_at, data: {...} }
        if (parsed && typeof parsed === "object") {
            if (parsed.data && typeof parsed.data === "object" && Array.isArray(parsed.data.entries)) {
                return parsed.data;
            }
            if (Array.isArray(parsed.entries)) {
                return { entries: parsed.entries, cultos_edicoes: parsed.cultos_edicoes || {} };
            }
        }
        return null;
    }

    function validateBackup(parsedOrString) {
        let parsed = parsedOrString;
        if (typeof parsedOrString === "string") {
            try {
                parsed = JSON.parse(parsedOrString);
            } catch (e) {
                return { ok: false, error: "Arquivo nao e um JSON valido." };
            }
        }
        const extracted = _extractLegacyOrWrapped(parsed);
        if (!extracted) {
            return { ok: false, error: "Estrutura de backup invalida (esperado 'entries')." };
        }
        // Validação básica de cada entrada
        for (const e of extracted.entries) {
            if (!e || typeof e !== "object") {
                return { ok: false, error: "Lancamento invalido encontrado no backup." };
            }
            if (!e.id || !e.type || typeof e.value === "undefined" || !e.date) {
                return { ok: false, error: "Lancamento com campos obrigatorios ausentes (id/type/value/date)." };
            }
            if (e.type !== "entrada" && e.type !== "saida") {
                return { ok: false, error: `Tipo de lancamento invalido: ${e.type}` };
            }
        }
        if (extracted.cultos_edicoes && typeof extracted.cultos_edicoes !== "object") {
            return { ok: false, error: "cultos_edicoes invalido." };
        }
        return { ok: true, data: extracted };
    }

    async function importJSON(jsonString) {
        const validation = validateBackup(jsonString);
        if (!validation.ok) return validation;
        return { ok: true, data: validation.data };
    }

    async function replaceData(novoObj) {
        // Fluxo seguro: valida antes de tocar nos dados atuais.
        const validation = validateBackup(novoObj);
        if (!validation.ok) return validation;
        // Cria uma cópia de segurança dos dados atuais antes de substituir.
        try {
            await BackupStore_saveSnapshot(_dados, "pre_restauracao");
        } catch (e) {
            console.warn("Nao foi possivel criar snapshot pre-restauracao:", e);
        }
        _dados = {
            entries: validation.data.entries,
            cultos_edicoes: validation.data.cultos_edicoes || {},
        };
        await _putState(_dados);
        return { ok: true };
    }

    async function mergeData(novoObj) {
        const validation = validateBackup(novoObj);
        if (!validation.ok) return validation;
        const existingIds = new Set(_dados.entries.map(e => e.id));
        for (const e of validation.data.entries) {
            if (!existingIds.has(e.id)) {
                _dados.entries.push(e);
                existingIds.add(e.id);
            }
        }
        for (const [mes, edicoes] of Object.entries(validation.data.cultos_edicoes || {})) {
            if (!_dados.cultos_edicoes[mes]) _dados.cultos_edicoes[mes] = {};
            Object.assign(_dados.cultos_edicoes[mes], edicoes);
        }
        await _putState(_dados);
        return { ok: true };
    }

    // ── Snapshots internos (cópia de segurança automática antes de restaurar) ──
    function BackupStore_saveSnapshot(dataObj, tag) {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_BACKUPS, "readwrite");
            const filename = `_snapshot_${tag}_${Date.now()}.json`;
            const payload = {
                backup_version: 1, app: "Caixa Moriah",
                created_at: new Date().toISOString(),
                data: { entries: dataObj.entries, cultos_edicoes: dataObj.cultos_edicoes },
            };
            const req = store.put({ filename, content: JSON.stringify(payload, null, 2), created_at: Date.now(), snapshot: true });
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    }

    async function listLocalBackups() {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_BACKUPS, "readonly");
            const req = store.getAll();
            req.onsuccess = () => {
                const all = (req.result || []).filter(b => !b.snapshot);
                all.sort((a, b) => b.created_at - a.created_at);
                resolve(all);
            };
            req.onerror = () => reject(req.error);
        });
    }

    async function saveLocalBackup(filename, content) {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_BACKUPS, "readwrite");
            const req = store.put({ filename, content, created_at: Date.now(), snapshot: false });
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    }

    async function getLocalBackup(filename) {
        return new Promise((resolve, reject) => {
            const store = _tx(STORE_BACKUPS, "readonly");
            const req = store.get(filename);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
        });
    }

    return {
        init, load, save, exportJSON, importJSON, validateBackup,
        replaceData, mergeData, listLocalBackups, saveLocalBackup, getLocalBackup,
    };
})();

// ========== finance.js ==========
// ══════════════════════════════════════════════════════════════════════════
// FINANCE.JS — equivalente a FinanceService do Python
// Preserva integralmente: ensure_fixed_entries, add_entry, add_dep_entry,
// add_saida, edit_entry, delete_entry, get_month_data, get_geral_data,
// sort_entries, sort_expenses, get_dep_grupos, calculate_balance,
// calculate_repasse, chaves_com_movimentacao
// ══════════════════════════════════════════════════════════════════════════

class FinanceService {
    constructor(dados) {
        this.dados = dados; // referência direta ao objeto do DataStore
        this.cultos = new CultosService(this.dados);
    }

    async _persist() {
        await DataStore.save();
    }

    // ── Registros fixos ──────────────────────────────────────────────────────
    async ensureFixedEntries(chave) {
        const presentes = new Set(
            this.dados.entries
                .filter(e => e.fixed_id && dataParaChave(e.date) === chave)
                .map(e => e.fixed_id)
        );
        const ano = parseInt(chave.slice(0, 4), 10);
        const mes = parseInt(chave.slice(5), 10);
        const ref = isoDate(inicioCaixa(ano, mes));
        let changed = false;
        for (const fx of ENTRADAS_FIXAS) {
            if (!presentes.has(fx.fixed_id)) {
                this.dados.entries.push({
                    id: gerarId(), desc: fx.desc, value: fx.value,
                    date: ref, type: "entrada", fixed_id: fx.fixed_id,
                    payment_type: "fixo", dep: false,
                });
                changed = true;
            }
        }
        for (const fx of DESPESAS_FIXAS) {
            if (!presentes.has(fx.fixed_id)) {
                this.dados.entries.push({
                    id: gerarId(), desc: fx.desc, value: fx.value,
                    date: ref, type: "saida", fixed_id: fx.fixed_id,
                    payment_type: "fixo", dep: false,
                });
                changed = true;
            }
        }
        if (changed) await this._persist();
        return changed;
    }

    // ── CRUD ──────────────────────────────────────────────────────────────────
    async addEntry(desc, value, dataStr, paymentType = "dinheiro", dep = false) {
        desc = (desc || "").trim();
        if (!desc || value <= 0) return null;
        if (!dataValida(dataStr)) dataStr = hojeStr();
        await this.ensureFixedEntries(dataParaChave(dataStr));
        const entry = {
            id: gerarId(), desc, value, date: dataStr, type: "entrada",
            payment_type: paymentType, dep, fixed_id: null,
        };
        this.dados.entries.push(entry);
        await this._persist();
        return entry;
    }

    async addDepEntry(descEntrada, descSaida, value, dataStr) {
        descEntrada = (descEntrada || "").trim();
        descSaida = (descSaida || "").trim();
        if (!descEntrada || value <= 0) return [null, null];
        if (!dataValida(dataStr)) dataStr = hojeStr();
        await this.ensureFixedEntries(dataParaChave(dataStr));
        const grupo = gerarId(), eid = gerarId(), sid = gerarId();
        const entrada = {
            id: eid, desc: descEntrada, value, date: dataStr,
            type: "entrada", payment_type: "dep", dep: true,
            fixed_id: null, grupo_vinculado: grupo, linked_saida: sid,
        };
        const saida = {
            id: sid, desc: descSaida, value, date: dataStr,
            type: "saida", payment_type: "dep", dep: true,
            fixed_id: null, auto_dep: true,
            grupo_vinculado: grupo, linked_entry: eid,
        };
        this.dados.entries.push(entrada, saida);
        await this._persist();
        return [entrada, saida];
    }

    async addSaida(desc, value, dataStr) {
        desc = (desc || "").trim();
        if (!desc || value <= 0) return null;
        if (!dataValida(dataStr)) dataStr = hojeStr();
        await this.ensureFixedEntries(dataParaChave(dataStr));
        const entry = {
            id: gerarId(), desc, value, date: dataStr, type: "saida",
            payment_type: "manual", dep: false, fixed_id: null,
        };
        this.dados.entries.push(entry);
        await this._persist();
        return entry;
    }

    async editEntry(eid, { desc = null, value = null, dataStr = null } = {}) {
        const target = this._getEntry(eid);
        if (!target) return false;
        if (desc !== null && desc.trim()) target.desc = desc.trim();
        if (value !== null && value > 0) target.value = value;
        if (dataStr !== null && dataValida(dataStr)) {
            target.date = dataStr;
            await this.ensureFixedEntries(dataParaChave(dataStr));
        }
        // Propaga valor/data para a saida vinculada (NUNCA a descricao)
        const linkedSid = target.linked_saida;
        if (linkedSid) {
            const linked = this._getEntry(linkedSid);
            if (linked) {
                if (value !== null && value > 0) linked.value = value;
                if (dataStr !== null && dataValida(dataStr)) linked.date = dataStr;
            }
        }
        await this._persist();
        return true;
    }

    async deleteEntry(eid) {
        const target = this._getEntry(eid);
        if (!target || target.fixed_id) return false;
        const idsRem = new Set([eid]);
        if (target.linked_saida) idsRem.add(target.linked_saida);
        if (target.linked_entry) {
            const mae = this._getEntry(target.linked_entry);
            if (mae && !mae.fixed_id) {
                idsRem.add(target.linked_entry);
                if (mae.linked_saida) idsRem.add(mae.linked_saida);
            }
        }
        this.dados.entries = this.dados.entries.filter(e => !idsRem.has(e.id));
        await this._persist();
        return true;
    }

    // ── Consultas ─────────────────────────────────────────────────────────────
    getMonthData(chave, depOnly = false) {
        if (depOnly) {
            return this.dados.entries.filter(e => dataParaChave(e.date) === chave && e.dep);
        }
        return this.dados.entries.filter(e => dataParaChave(e.date) === chave);
    }

    getGeralData(chave) {
        return this.dados.entries.filter(e => dataParaChave(e.date) === chave && !e.dep);
    }

    sortEntries(entries) {
        const idsEnt = ENTRADAS_FIXAS.map(fx => fx.fixed_id);
        const keyed = entries.map((e, idx) => {
            let k;
            if (e.fixed_id) {
                const i = idsEnt.indexOf(e.fixed_id);
                k = [2, i >= 0 ? i : 99, e.date];
            } else if (e.payment_type === "pix") {
                k = [0, 0, e.date];
            } else {
                k = [1, 0, e.date];
            }
            return { e, k, idx };
        });
        keyed.sort((a, b) => _cmpKey(a.k, b.k) || (a.idx - b.idx));
        return keyed.map(x => x.e);
    }

    sortExpenses(expenses) {
        const idsSai = DESPESAS_FIXAS.map(fx => fx.fixed_id);
        const keyed = expenses.map((e, idx) => {
            let k;
            if (e.fixed_id) {
                const i = idsSai.indexOf(e.fixed_id);
                k = [0, i >= 0 ? i : 99, e.date];
            } else if (e.auto_dep) {
                k = [1, 0, e.date];
            } else {
                k = [2, 0, e.date];
            }
            return { e, k, idx };
        });
        keyed.sort((a, b) => _cmpKey(a.k, b.k) || (a.idx - b.idx));
        return keyed.map(x => x.e);
    }

    getDepGrupos(chave) {
        const mes = this.dados.entries.filter(e => dataParaChave(e.date) === chave && e.dep);
        const entradas = mes.filter(e => e.type === "entrada").sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
        const saidasMap = new Map(mes.filter(e => e.type === "saida").map(e => [e.id, e]));
        const grupos = [];
        const seen = new Set();
        for (const ent of entradas) {
            const sid = ent.linked_saida;
            const sai = sid ? saidasMap.get(sid) : null;
            if (sai) seen.add(sid);
            grupos.push([ent, sai || null]);
        }
        for (const [sid, sai] of saidasMap.entries()) {
            if (!seen.has(sid)) grupos.push([null, sai]);
        }
        return grupos;
    }

    calculateBalance(chave, geralOnly = false) {
        const entries = geralOnly ? this.getGeralData(chave) : this.getMonthData(chave);
        const ent = entries.filter(e => e.type === "entrada").reduce((s, e) => s + e.value, 0);
        const sai = entries.filter(e => e.type === "saida").reduce((s, e) => s + e.value, 0);
        return [ent, sai, ent - sai];
    }

    calculateRepasse(chave) {
        const entries = this.getGeralData(chave);
        const entSemPix = entries
            .filter(e => e.type === "entrada" && e.payment_type !== "pix")
            .reduce((s, e) => s + e.value, 0);
        const sai = entries.filter(e => e.type === "saida").reduce((s, e) => s + e.value, 0);
        return entSemPix - sai;
    }

    chavesComMovimentacao(depOnly = false, geralOnly = false) {
        let set;
        if (depOnly) {
            set = new Set(this.dados.entries.filter(e => e.dep).map(e => dataParaChave(e.date)));
        } else if (geralOnly) {
            set = new Set(this.dados.entries.filter(e => !e.dep).map(e => dataParaChave(e.date)));
        } else {
            set = new Set(this.dados.entries.map(e => dataParaChave(e.date)));
        }
        return Array.from(set).sort();
    }

    _getEntry(eid) {
        return this.dados.entries.find(e => e.id === eid) || null;
    }
}

function _cmpKey(a, b) {
    for (let i = 0; i < a.length; i++) {
        if (a[i] < b[i]) return -1;
        if (a[i] > b[i]) return 1;
    }
    return 0;
}

// ── Migração de dados legados (equivalente a migrar_dados_legados) ─────────
async function migrarDadosLegados(svc) {
    let changed = false;
    const entries = svc.dados.entries;
    const saidasPorGrupo = {};
    for (const e of entries) {
        if (e.type === "saida" && e.grupo_vinculado) {
            if (!saidasPorGrupo[e.grupo_vinculado]) saidasPorGrupo[e.grupo_vinculado] = [];
            saidasPorGrupo[e.grupo_vinculado].push(e);
        }
    }
    for (const e of entries) {
        if (e.type !== "entrada" || !e.dep) continue;
        if (e.linked_saida) continue;
        const grupo = e.grupo_vinculado;
        if (grupo && saidasPorGrupo[grupo] && saidasPorGrupo[grupo].length) {
            const sai = saidasPorGrupo[grupo][0];
            e.linked_saida = sai.id;
            sai.linked_entry = e.id;
            sai.auto_dep = true;
            changed = true;
        } else {
            const novoGrupo = grupo || gerarId();
            const sid = gerarId();
            e.grupo_vinculado = novoGrupo;
            e.linked_saida = sid;
            entries.push({
                id: sid, desc: e.desc, value: e.value, date: e.date,
                type: "saida", payment_type: "dep", dep: true, fixed_id: null,
                auto_dep: true, grupo_vinculado: novoGrupo, linked_entry: e.id,
            });
            changed = true;
        }
    }
    if (changed) await DataStore.save();
    return changed;
}

// ========== backup.js ==========
// ══════════════════════════════════════════════════════════════════════════
// BACKUP.JS — equivalente a BackupService do Python
//
// Regras preservadas:
//  - Backup é SEMPRE manual (usuário clica em "Criar Backup").
//  - Nunca criamos backup automático.
//  - Restauração: ler -> validar JSON -> validar estrutura -> confirmar
//    com usuário -> criar snapshot de seguranca -> substituir -> validar ->
//    recarregar interface. Nunca limpa antes de validar.
//  - Se o navegador suportar File System Access API, o usuário escolhe uma
//    pasta "Caixa Moriah/" com subpastas Backups/ e PDFs/, e os arquivos
//    são salvos diretamente lá. Caso contrário, cai para download comum.
// ══════════════════════════════════════════════════════════════════════════

const BackupService = (function () {
    let _dirHandle = null;       // handle da pasta raiz "Caixa Moriah"
    let _backupsHandle = null;   // subpasta Backups/
    let _pdfsHandle = null;      // subpasta PDFs/

    function supportsFS() {
        return "showDirectoryPicker" in window;
    }

    async function escolherPasta() {
        if (!supportsFS()) return { ok: false, error: "File System Access API indisponivel neste navegador." };
        try {
            _dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
            _backupsHandle = await _dirHandle.getDirectoryHandle("Backups", { create: true });
            _pdfsHandle = await _dirHandle.getDirectoryHandle("PDFs", { create: true });
            return { ok: true, name: _dirHandle.name };
        } catch (e) {
            return { ok: false, error: "Selecao de pasta cancelada ou negada." };
        }
    }

    function pastaSelecionada() {
        return _dirHandle ? _dirHandle.name : null;
    }

    function _timestamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }

    async function _writeFile(dirHandle, filename, content) {
        const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
    }

    function _downloadFallback(filename, content, mime = "application/json") {
        const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    // ── Criar backup manual ────────────────────────────────────────────────
    async function criarBackup() {
        const content = DataStore.exportJSON();
        const filename = `caixa_backup_${_timestamp()}.json`;

        // Sempre guarda também uma cópia local (IndexedDB) para listagem/restauração
        // rápida dentro do próprio app, independente de onde o usuário salvou o arquivo.
        await DataStore.saveLocalBackup(filename, content);

        if (_backupsHandle) {
            try {
                await _writeFile(_backupsHandle, filename, content);
                return { ok: true, filename, method: "filesystem", folder: `${_dirHandle.name}/Backups` };
            } catch (e) {
                console.warn("Falha ao gravar via File System Access API, usando download:", e);
            }
        }
        _downloadFallback(filename, content);
        return { ok: true, filename, method: "download" };
    }

    // ── Listar backups (armazenados localmente no navegador) ───────────────
    async function listarBackups() {
        const list = await DataStore.listLocalBackups();
        return list.map(b => ({
            filename: b.filename,
            created_at: b.created_at,
            label: nomeCurto(b.filename),
        }));
    }

    function nomeCurto(filename) {
        try {
            const semPrefixo = filename.replace("caixa_backup_", "").replace(".json", "");
            const [d, h] = semPrefixo.split("_");
            return `${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}  ${h.slice(0,2)}:${h.slice(2,4)}`;
        } catch (e) {
            return filename;
        }
    }

    // ── Restaurar a partir de um backup local (já validado ao criar) ───────
    async function restaurarLocal(filename) {
        const rec = await DataStore.getLocalBackup(filename);
        if (!rec) return { ok: false, error: "Backup nao encontrado." };
        return DataStore.replaceData(rec.content);
    }

    // ── Restaurar a partir de um arquivo escolhido pelo usuário (upload) ───
    async function restaurarDeArquivo(file) {
        let text;
        try {
            text = await file.text();
        } catch (e) {
            return { ok: false, error: "Nao foi possivel ler o arquivo selecionado." };
        }
        const validation = DataStore.validateBackup(text);
        if (!validation.ok) {
            return { ok: false, error: `Backup invalido: ${validation.error}` };
        }
        return DataStore.replaceData(validation.data);
    }

    return {
        supportsFS, escolherPasta, pastaSelecionada,
        criarBackup, listarBackups, nomeCurto,
        restaurarLocal, restaurarDeArquivo,
        get pdfsHandle() { return _pdfsHandle; },
        get backupsHandle() { return _backupsHandle; },
        downloadFallback: _downloadFallback,
    };
})();

// ========== cloud.js ==========
// ══════════════════════════════════════════════════════════════════════════
// CLOUD.JS — backup automático na nuvem (Supabase)
//
// Regras:
//  - Senha fixa CLOUD_PIN = "3003" só para LIGAR a nuvem e RESTAURAR da nuvem.
//  - Backup físico (arquivo) e restauração de arquivo NÃO pedem senha.
//  - Sync automático só roda se a nuvem estiver "ligada" nesta sessão
//    (depois de digitar a senha) e se URL + chave anon estiverem configuradas.
//  - Quem abre o link sem ligar a nuvem só mexe no IndexedDB local.
// ══════════════════════════════════════════════════════════════════════════

const CloudService = (function () {
    const CLOUD_PIN = "3003";
    const LS_URL = "caixa_moriah_supabase_url";
    const LS_KEY = "caixa_moriah_supabase_key";
    const SS_UNLOCKED = "caixa_moriah_cloud_unlocked";
    const TABLE = "caixa_backups";
    const MAX_VERSIONS = 15;
    const DEBOUNCE_MS = 2500;

    let _timer = null;
    let _syncing = false;
    let _lastStatus = "";

    function getConfig() {
        return {
            url: (localStorage.getItem(LS_URL) || "").trim().replace(/\/$/, ""),
            key: (localStorage.getItem(LS_KEY) || "").trim(),
        };
    }

    function setConfig(url, key) {
        localStorage.setItem(LS_URL, (url || "").trim().replace(/\/$/, ""));
        localStorage.setItem(LS_KEY, (key || "").trim());
    }

    function isConfigured() {
        const c = getConfig();
        return !!(c.url && c.key && c.url.startsWith("http"));
    }

    function isUnlocked() {
        return sessionStorage.getItem(SS_UNLOCKED) === "1";
    }

    function unlock(pin) {
        if (String(pin) !== CLOUD_PIN) return { ok: false, error: "Senha incorreta." };
        if (!isConfigured()) return { ok: false, error: "Configure a URL e a chave do Supabase antes." };
        sessionStorage.setItem(SS_UNLOCKED, "1");
        return { ok: true };
    }

    function lock() {
        sessionStorage.removeItem(SS_UNLOCKED);
    }

    function askPin(titulo) {
        return new Promise((resolve) => {
            openModal(`
            <div class="modal-hdr" style="color:var(--accent)">${escapeHtml(titulo || "Senha da nuvem")}</div>
            <div class="modal-scroll">
                <div class="small-note" style="margin-bottom:8px">Digite a senha para continuar.</div>
                <input type="password" id="cloud-pin-input" class="field" placeholder="Senha" inputmode="numeric" autocomplete="off">
                <div class="btn-row" style="margin-top:10px">
                    <button class="btn btn-border" id="cloud-pin-cancel">Cancelar</button>
                    <button class="btn btn-accent" id="cloud-pin-ok">Confirmar</button>
                </div>
            </div>`, {
                onOpen: () => {
                    const input = document.getElementById("cloud-pin-input");
                    input.focus();
                    const finish = (val) => { closeModal(); resolve(val); };
                    document.getElementById("cloud-pin-cancel").onclick = () => finish(null);
                    document.getElementById("cloud-pin-ok").onclick = () => finish(input.value);
                    input.onkeydown = (ev) => {
                        if (ev.key === "Enter") finish(input.value);
                    };
                }
            });
        });
    }

    async function ensureUnlocked(titulo) {
        if (isUnlocked()) return { ok: true };
        const pin = await askPin(titulo || "Ligar nuvem");
        if (pin === null) return { ok: false, error: "Cancelado." };
        return unlock(pin);
    }

    function _headers(key, extra = {}) {
        return Object.assign({
            "apikey": key,
            "Authorization": `Bearer ${key}`,
            "Content-Type": "application/json",
        }, extra);
    }

    async function uploadNow() {
        if (!isConfigured() || !isUnlocked()) {
            return { ok: false, error: "Nuvem nao ligada ou nao configurada." };
        }
        if (_syncing) return { ok: false, error: "Sync em andamento." };
        _syncing = true;
        _lastStatus = "enviando...";
        try {
            const { url, key } = getConfig();
            const content = DataStore.exportJSON();
            let entryCount = 0;
            try {
                const parsed = JSON.parse(content);
                entryCount = (parsed.data && parsed.data.entries) ? parsed.data.entries.length
                    : (parsed.entries ? parsed.entries.length : 0);
            } catch (e) { /* ignore */ }

            const body = [{
                content,
                entry_count: entryCount,
                app_label: "Caixa Moriah",
            }];

            const res = await fetch(`${url}/rest/v1/${TABLE}`, {
                method: "POST",
                headers: _headers(key, { "Prefer": "return=minimal" }),
                body: JSON.stringify(body),
            });

            if (!res.ok) {
                const txt = await res.text().catch(() => "");
                _lastStatus = "erro ao enviar";
                return { ok: false, error: `Falha na nuvem (${res.status}): ${txt.slice(0, 120)}` };
            }

            // Limpa versões antigas (mantém as mais recentes)
            try { await _pruneOld(url, key); } catch (e) { console.warn("prune:", e); }

            _lastStatus = "ok " + new Date().toLocaleTimeString("pt-BR");
            return { ok: true };
        } catch (e) {
            _lastStatus = "erro de rede";
            return { ok: false, error: e.message || "Erro de rede ao enviar backup." };
        } finally {
            _syncing = false;
        }
    }

    async function _pruneOld(url, key) {
        const list = await listVersions();
        if (!list.ok || list.items.length <= MAX_VERSIONS) return;
        const toDelete = list.items.slice(MAX_VERSIONS);
        for (const item of toDelete) {
            await fetch(`${url}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(item.id)}`, {
                method: "DELETE",
                headers: _headers(key),
            });
        }
    }

    async function listVersions() {
        if (!isConfigured()) return { ok: false, error: "Nuvem nao configurada.", items: [] };
        const { url, key } = getConfig();
        try {
            const res = await fetch(
                `${url}/rest/v1/${TABLE}?select=id,created_at,entry_count,app_label&order=created_at.desc&limit=20`,
                { headers: _headers(key) }
            );
            if (!res.ok) {
                const txt = await res.text().catch(() => "");
                return { ok: false, error: `Falha ao listar (${res.status}): ${txt.slice(0, 120)}`, items: [] };
            }
            const rows = await res.json();
            return {
                ok: true,
                items: (rows || []).map(r => ({
                    id: r.id,
                    created_at: r.created_at,
                    entry_count: r.entry_count || 0,
                    label: _fmtDate(r.created_at) + `  (${r.entry_count || 0} lanc.)`,
                })),
            };
        } catch (e) {
            return { ok: false, error: e.message || "Erro de rede.", items: [] };
        }
    }

    function _fmtDate(iso) {
        try {
            const d = new Date(iso);
            const pad = (n) => String(n).padStart(2, "0");
            return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        } catch (e) {
            return iso || "";
        }
    }

    async function fetchVersionContent(id) {
        if (!isConfigured()) return { ok: false, error: "Nuvem nao configurada." };
        const { url, key } = getConfig();
        try {
            const res = await fetch(
                `${url}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}&select=content`,
                { headers: _headers(key) }
            );
            if (!res.ok) {
                const txt = await res.text().catch(() => "");
                return { ok: false, error: `Falha ao baixar (${res.status}): ${txt.slice(0, 120)}` };
            }
            const rows = await res.json();
            if (!rows || !rows[0] || !rows[0].content) {
                return { ok: false, error: "Backup nao encontrado na nuvem." };
            }
            return { ok: true, content: rows[0].content };
        } catch (e) {
            return { ok: false, error: e.message || "Erro de rede." };
        }
    }

    async function restoreVersion(id) {
        const got = await fetchVersionContent(id);
        if (!got.ok) return got;
        return DataStore.replaceData(got.content);
    }

    /** Agenda upload automático (debounce). Só age se nuvem ligada. */
    function scheduleSync() {
        if (!isConfigured() || !isUnlocked()) return;
        clearTimeout(_timer);
        _timer = setTimeout(() => {
            uploadNow().then((r) => {
                if (!r.ok) console.warn("Cloud sync:", r.error);
            });
        }, DEBOUNCE_MS);
    }

    function statusText() {
        if (!isConfigured()) return "Nuvem nao configurada";
        if (!isUnlocked()) return "Nuvem configurada — desligada neste aparelho";
        return _syncing ? "Sincronizando..." : (_lastStatus ? `Nuvem ligada (${_lastStatus})` : "Nuvem ligada");
    }

    return {
        getConfig, setConfig, isConfigured, isUnlocked,
        unlock, lock, ensureUnlocked, askPin,
        uploadNow, listVersions, restoreVersion, scheduleSync, statusText,
        CLOUD_PIN, // não expor na UI; só referência interna
    };
})();

// ========== pdf.js ==========
// ══════════════════════════════════════════════════════════════════════════
// PDF.JS — equivalente a PDFService do Python (livro-caixa modelo CaixaMoriah)
//
// Estratégia de fidelidade: o código Python desenha em coordenadas PDF
// padrão (origem no canto inferior-esquerdo, Y crescendo para cima).
// jsPDF usa origem no canto superior-esquerdo (Y crescendo para baixo).
// Por isso, todas as primitivas abaixo (_rect, _line, _text, _circle)
// recebem coordenadas EXATAMENTE como no Python (Y a partir da base da
// pagina) e fazem a conversao internamente: jsY = PAGE_H - y.
// Isso permite portar a logica de layout quase 1:1.
// ══════════════════════════════════════════════════════════════════════════

class PDFService {
    constructor() {
        this.PAGE_W = 595;
        this.PAGE_H = 842;
        this.ML = 36; this.MR = 36; this.MT = 28; this.MB = 20;

        this.FN = "helvetica"; // normal
        this.FB = "helvetica"; // bold (estilo setado separadamente)
        this.FI = "helvetica"; // italic

        // Paleta (RGB 0-255, convertida de 0-1 do original)
        this.C_NAVY   = [33, 48, 97];
        this.C_NAVY2  = [46, 64, 117];
        this.C_GOLD   = [214, 160, 36];
        this.C_GOLD2  = [242, 199, 64];
        this.C_WHITE  = [255, 255, 255];
        this.C_BLACK  = [38, 38, 38];
        this.C_LGRAY  = [241, 242, 244];
        this.C_DGRAY  = [166, 166, 166];
        this.C_BGBOX  = [247, 247, 255];
        this.C_GREEN  = [20, 140, 56];
        this.C_RED    = [184, 31, 31];
        this.C_AMBER  = [199, 130, 10];
        this.C_GRTEXT = [26, 107, 46];
        this.C_RDTEXT = [153, 20, 20];
        this.C_PURPLE = [82, 26, 140];
        this.C_PURPLT = [140, 51, 204];

        this.ROWS_PER_PAGE = 36;
        this.ROW_H = 13;
        this.CAB_H = 96;
        this.CAB_CONT = 46;
        this.HDR_ROW_H = 18;
        this.GAP_CAB = 4;
        this.GAP_TAB = 6;
        this.TOTAIS_H = 42;
        this.ASSIN_H = 56;
        this.NUM_PAG_H = 10;
    }

    get W() { return this.PAGE_W - this.ML - this.MR; }

    get colW() {
        const w = this.W;
        const num = Math.floor(w * 0.072);
        const ent = Math.floor(w * 0.185);
        const sai = Math.floor(w * 0.185);
        const hist = w - num - ent - sai;
        return { num, hist, ent, sai };
    }

    // ════════════════════════════════════════════════════════════════════
    // API PÚBLICA
    // ════════════════════════════════════════════════════════════════════

    exportarRelatorios(svc, chave) {
        const geral = this.gerarPdfCaixaGeral(svc, chave);
        const dep = this.gerarPdfDepartamentos(svc, chave);
        return { geral, dep };
    }

    gerarPdfCaixaGeral(svc, chave) {
        const [mesNome, anoStr] = this._parseChave(chave);
        const nome = `Caixa_Geral_${mesNome}_${anoStr}.pdf`;

        const lancamentos = this._coletarLancamentosGeral(svc, chave);
        const totEnt = lancamentos.filter(l => l.tipo === "E").reduce((s, l) => s + l.valor, 0);
        const totSai = lancamentos.filter(l => l.tipo === "S").reduce((s, l) => s + l.valor, 0);
        const saldo = totEnt - totSai;

        const paginas = this._montarPaginas(lancamentos);
        const doc = this._novoDoc();

        paginas.forEach((lote, idx) => {
            if (idx > 0) doc.addPage([this.PAGE_W, this.PAGE_H]);
            this._renderLivroCaixa(doc, lote, idx + 1, paginas.length,
                mesNome, anoStr, totEnt, totSai, saldo,
                "CAIXA GERAL", idx === paginas.length - 1);
        });

        return { doc, filename: nome };
    }

    gerarPdfDepartamentos(svc, chave) {
        const [mesNome, anoStr] = this._parseChave(chave);
        const nome = `Departamentos_${mesNome}_${anoStr}.pdf`;
        const grupos = svc.getDepGrupos(chave);
        const doc = this._novoDoc();
        this._renderDepartamentos(doc, grupos, mesNome, anoStr);
        return { doc, filename: nome };
    }

    _novoDoc() {
        const { jsPDF } = window.jspdf;
        return new jsPDF({ unit: "pt", format: [this.PAGE_W, this.PAGE_H], compress: true });
    }

    // ════════════════════════════════════════════════════════════════════
    // HELPERS DE PERÍODO / COLETA
    // ════════════════════════════════════════════════════════════════════

    _parseChave(chave) {
        try {
            const mesNome = MESES[parseInt(chave.slice(5, 7), 10) - 1];
            const anoStr = chave.slice(0, 4);
            return [mesNome, anoStr];
        } catch (e) {
            return [chave.slice(5, 7), chave.slice(0, 4)];
        }
    }

    _coletarLancamentosGeral(svc, chave) {
        const todos = svc.getGeralData(chave);
        const entradas = svc.sortEntries(todos.filter(e => e.type === "entrada"));
        const saidas = svc.sortExpenses(todos.filter(e => e.type === "saida"));
        const resultado = [];
        for (const e of entradas) resultado.push({ hist: this._historico(e), valor: parseFloat(e.value), tipo: "E" });
        for (const e of saidas) resultado.push({ hist: this._historico(e), valor: parseFloat(e.value), tipo: "S" });
        resultado.forEach((l, i) => { l.num = i + 1; });
        return resultado;
    }

    _historico(entry) {
        let desc = String(entry.desc || "").trim();
        if (entry.payment_type === "pix" && !desc.toUpperCase().startsWith("PIX")) {
            return `PIX - ${desc}`;
        }
        return desc;
    }

    _montarPaginas(lancamentos, rows = null) {
        const n = rows || this.ROWS_PER_PAGE;
        if (!lancamentos.length) return [[]];
        const paginas = [];
        for (let i = 0; i < lancamentos.length; i += n) {
            paginas.push(lancamentos.slice(i, i + n));
        }
        return paginas;
    }

    // ════════════════════════════════════════════════════════════════════
    // RENDER — LIVRO CAIXA (usado tanto para Caixa Geral quanto Departamentos)
    // ════════════════════════════════════════════════════════════════════

    _renderLivroCaixa(doc, lancamentos, numPag, totalPags, mesNome, anoStr,
                       totEnt, totSai, saldo, tituloDoc, ultima) {
        const ml = this.ML, mr = this.MR, pw = this.PAGE_W, ph = this.PAGE_H;
        const w = this.W, cw = this.colW;

        let yTopo;
        if (numPag === 1) {
            yTopo = this._drawCabecalho(doc, ml, ph, w, mesNome, anoStr, tituloDoc);
        } else {
            yTopo = this._drawContinuacaoCab(doc, ml, ph, w, mesNome, anoStr, numPag, tituloDoc);
        }

        const yTab = yTopo - this.GAP_CAB;
        const yDadosIni = this._drawHeaderRow(doc, ml, yTab, cw);
        const yDadosFim = this._drawLinhasFixas(doc, ml, yDadosIni, cw, lancamentos);

        if (ultima) {
            const yTotais = yDadosFim - this.GAP_TAB;
            this._drawTotais(doc, ml, yTotais, w, totEnt, totSai, saldo);
            this._drawRodape(doc, ml, mr, pw, ph);
        }

        this._text(doc, this.FN, 7, pw / 2, this.MB + this.NUM_PAG_H - 2,
            `Pagina ${numPag} de ${totalPags}`, { color: this.C_DGRAY, center: true });
    }

    // ════════════════════════════════════════════════════════════════════
    // RENDER — DEPARTAMENTOS
    // ════════════════════════════════════════════════════════════════════

    _renderDepartamentos(doc, grupos, mesNome, anoStr) {
        const ph = this.PAGE_H, pw = this.PAGE_W, ml = this.ML, mr = this.MR, w = this.W;

        if (!grupos.length) {
            const y = this._drawCabecalhoDep(doc, ml, ph, w, mesNome, anoStr, 1);
            this._text(doc, this.FI, 11, ml + w / 2, y - 40,
                "Nenhum lancamento de departamento registrado.",
                { color: this.C_DGRAY, center: true, italic: true });
            this._drawRodape(doc, ml, mr, pw, ph);
            this._text(doc, this.FN, 7, pw / 2, this.MB + this.NUM_PAG_H - 2,
                "Pagina 1 de 1", { color: this.C_DGRAY, center: true });
            return;
        }

        const lancamentos = [];
        for (const [ent, sai] of grupos) {
            if (ent) lancamentos.push({ hist: this._historico(ent), valor: parseFloat(ent.value), tipo: "E" });
            if (sai) lancamentos.push({ hist: this._historico(sai), valor: parseFloat(sai.value), tipo: "S" });
        }
        lancamentos.forEach((l, i) => { l.num = i + 1; });

        const totEnt = lancamentos.filter(l => l.tipo === "E").reduce((s, l) => s + l.valor, 0);
        const totSai = lancamentos.filter(l => l.tipo === "S").reduce((s, l) => s + l.valor, 0);
        const saldo = totEnt - totSai;

        const paginas = this._montarPaginas(lancamentos);
        paginas.forEach((lote, idx) => {
            if (idx > 0) doc.addPage([this.PAGE_W, this.PAGE_H]);
            this._renderLivroCaixa(doc, lote, idx + 1, paginas.length,
                mesNome, anoStr, totEnt, totSai, saldo,
                "DEPARTAMENTOS", idx === paginas.length - 1);
        });
    }

    _drawCabecalhoDep(doc, ml, ph, w, mesNome, anoStr, numPag) {
        if (numPag === 1) return this._drawCabecalho(doc, ml, ph, w, mesNome, anoStr, "DEPARTAMENTOS");
        return this._drawContinuacaoCab(doc, ml, ph, w, mesNome, anoStr, numPag, "DEPARTAMENTOS");
    }

    // ════════════════════════════════════════════════════════════════════
    // CABEÇALHO PRINCIPAL
    // ════════════════════════════════════════════════════════════════════

    _drawCabecalho(doc, ml, ph, w, mesNome, anoStr, tituloDoc) {
        const yTop = ph - this.MT;
        const cabH = this.CAB_H;

        this._rect(doc, ml, yTop - cabH, w, cabH, { fill: this.C_NAVY });

        const blocoEsqW = Math.floor(w * 0.285);
        const blocoDirW = Math.floor(w * 0.195);
        const blocoTitW = w - blocoEsqW - blocoDirW;
        const sep1x = ml + blocoEsqW;
        const sep2x = sep1x + blocoTitW;

        for (const sx of [sep1x, sep2x]) {
            this._line(doc, sx, yTop - 6, sx, yTop - cabH + 6, { color: this.C_GOLD, lw: 0.8 });
        }

        // Logo
        const padding = 5;
        let logoHpt = cabH - padding * 2;
        let logoWpt = Math.floor(logoHpt * LOGO_W_PX / Math.max(LOGO_H_PX, 1));
        const maxLogoW = blocoEsqW - 8;
        if (logoWpt > maxLogoW) {
            logoWpt = maxLogoW;
            logoHpt = Math.floor(logoWpt * LOGO_H_PX / Math.max(LOGO_W_PX, 1));
        }
        const logoX = ml + (blocoEsqW - logoWpt) / 2;
        const logoYbottom = yTop - cabH + (cabH - logoHpt) / 2;
        try {
            const jsY = this.PAGE_H - (logoYbottom + logoHpt);
            doc.addImage(LOGO_BASE64, "JPEG", logoX, jsY, logoWpt, logoHpt);
        } catch (e) { /* logo indisponivel, segue sem quebrar layout */ }

        // Título central
        const titCx = sep1x + blocoTitW / 2;
        this._text(doc, this.FB, 20, titCx, yTop - 30, "MOVIMENTACAO",
            { color: this.C_WHITE, center: true, bold: true });
        if (tituloDoc === "DEPARTAMENTOS") {
            this._text(doc, this.FB, 14, titCx, yTop - 53, "DEPARTAMENTOS",
                { color: this.C_GOLD, center: true, bold: true });
        } else {
            this._text(doc, this.FB, 20, titCx, yTop - 53, "DO CAIXA",
                { color: this.C_GOLD, center: true, bold: true });
        }
        this._line(doc, sep1x + 14, yTop - 62, sep2x - 14, yTop - 62, { color: this.C_GOLD, lw: 0.5 });

        // Sub-box congregação
        const bx2 = sep1x + 8, bw2 = blocoTitW - 16;
        const by2 = yTop - cabH + 8, bh2 = 22;
        this._rect(doc, bx2, by2, bw2, bh2, { fill: [247, 247, 255], stroke: this.C_GOLD, lw: 0.5, radius: 3 });
        this._text(doc, this.FN, 7.5, bx2 + bw2 / 2, by2 + 8, "CONGREGACAO  IEADFAZ  MONTE MORIA",
            { color: this.C_NAVY, center: true });

        // Mês / Ano
        const bx = sep2x + 7;
        const bw = w - blocoEsqW - blocoTitW - 14;

        this._text(doc, this.FB, 8, bx, yTop - 14, "MES:", { color: this.C_GOLD2, bold: true });
        const mesY = yTop - 36;
        this._rect(doc, bx, mesY, bw, 19, { fill: this.C_BGBOX, stroke: this.C_GOLD, lw: 0.6, radius: 2 });
        this._text(doc, this.FB, 9.5, bx + bw / 2, mesY + 6, mesNome, { color: this.C_NAVY, center: true, bold: true });

        this._text(doc, this.FB, 8, bx, yTop - 54, "ANO:", { color: this.C_GOLD2, bold: true });
        const anoY = yTop - 76;
        this._rect(doc, bx, anoY, bw, 19, { fill: this.C_BGBOX, stroke: this.C_GOLD, lw: 0.6, radius: 2 });
        this._text(doc, this.FB, 9.5, bx + bw / 2, anoY + 6, anoStr, { color: this.C_NAVY, center: true, bold: true });

        return yTop - cabH;
    }

    _drawContinuacaoCab(doc, ml, ph, w, mesNome, anoStr, numPag, tituloDoc) {
        const yTop = ph - this.MT, cabH = this.CAB_CONT;
        this._rect(doc, ml, yTop - cabH, w, cabH, { fill: this.C_NAVY });
        const cx = ml + w / 2;
        this._text(doc, this.FB, 13, cx, yTop - 16,
            `MOVIMENTACAO - ${tituloDoc}  -  CONTINUACAO`,
            { color: this.C_WHITE, center: true, bold: true });
        this._text(doc, this.FN, 9, cx, yTop - 32,
            `IEADFAZ CONGREGACAO MONTE MORIA  |  ${mesNome} / ${anoStr}  |  Pag. ${numPag}`,
            { color: this.C_GOLD, center: true });
        return yTop - cabH;
    }

    _drawHeaderRow(doc, ml, y, cw) {
        const rh = this.HDR_ROW_H, yBot = y - rh;
        const tw = cw.num + cw.hist + cw.ent + cw.sai;
        this._rect(doc, ml, yBot, tw, rh, { fill: this.C_NAVY2 });

        const xHist = ml + cw.num, xEnt = xHist + cw.hist, xSai = xEnt + cw.ent;
        const cy = yBot + rh / 2 - 3;

        const cols = [
            [ml + cw.num / 2, "No"],
            [xHist + cw.hist / 2, "HISTORICO"],
            [xEnt + cw.ent / 2, "ENTRADA (+)"],
            [xSai + cw.sai / 2, "SAIDA (-)"],
        ];
        for (const [lx, txt] of cols) {
            this._text(doc, this.FB, 8, lx, cy, txt, { color: this.C_WHITE, center: true, bold: true });
        }
        for (const sx of [xHist, xEnt, xSai]) {
            this._line(doc, sx, yBot, sx, y, { color: this.C_GOLD, lw: 0.4 });
        }
        this._line(doc, ml, yBot, ml + tw, yBot, { color: this.C_GOLD, lw: 0.8 });
        return yBot;
    }

    _drawLinhasFixas(doc, ml, y, cw, lancamentos) {
        const rh = this.ROW_H;
        const tw = cw.num + cw.hist + cw.ent + cw.sai;
        const xHist = ml + cw.num, xEnt = xHist + cw.hist, xSai = xEnt + cw.ent;
        const maxH = 50;
        const yTopo = y;
        const n = this.ROWS_PER_PAGE;

        for (let i = 0; i < n; i++) {
            const yBot = y - rh;
            const bg = (i % 2 === 0) ? this.C_WHITE : this.C_LGRAY;
            this._rect(doc, ml, yBot, tw, rh, { fill: bg });
            const cy = yBot + rh / 2 - 3;

            if (i < lancamentos.length) {
                const l = lancamentos[i];
                this._text(doc, this.FB, 7.5, ml + cw.num / 2, cy,
                    String(l.num).padStart(2, "0"), { color: this.C_NAVY, center: true, bold: true });
                let hist = l.hist;
                if (hist.length > maxH) hist = hist.slice(0, maxH - 2) + "..";
                this._text(doc, this.FN, 8.5, xHist + 5, cy, hist, { color: this.C_BLACK });
                const valorFmt = "R$ " + this._fmtMoeda(l.valor);
                if (l.tipo === "E") {
                    this._text(doc, this.FB, 8, xEnt + cw.ent - 4, cy, valorFmt,
                        { color: this.C_GRTEXT, right: true, bold: true });
                } else {
                    this._text(doc, this.FB, 8, xSai + cw.sai - 4, cy, valorFmt,
                        { color: this.C_RDTEXT, right: true, bold: true });
                }
            }

            for (const sx of [xHist, xEnt, xSai]) {
                this._line(doc, sx, yBot, sx, y, { color: this.C_DGRAY, lw: 0.2 });
            }
            this._line(doc, ml, yBot, ml + tw, yBot, { color: this.C_DGRAY, lw: 0.2 });
            y = yBot;
        }

        const yFim = y;
        this._line(doc, ml, yTopo, ml, yFim, { color: this.C_NAVY, lw: 0.8 });
        this._line(doc, ml + tw, yTopo, ml + tw, yFim, { color: this.C_NAVY, lw: 0.8 });
        this._line(doc, ml, yTopo, ml + tw, yTopo, { color: this.C_NAVY, lw: 0.4 });
        return yFim;
    }

    _drawTotais(doc, ml, yTop, w, totEnt, totSai, saldo) {
        const cardH = this.TOTAIS_H, gap = 7;
        const cardW = (w - gap * 2) / 3;

        const cards = [
            ["TOTAL DE ENTRADAS", "R$ " + this._fmtMoeda(totEnt), this.C_GREEN],
            ["TOTAL DE SAIDAS", "R$ " + this._fmtMoeda(totSai), this.C_RED],
            ["SALDO ATUAL", "R$ " + this._fmtMoeda(saldo), this.C_AMBER],
        ];
        cards.forEach(([label, valor, cor], i) => {
            const cx = ml + i * (cardW + gap);
            const cyB = yTop - cardH;
            this._rect(doc, cx, cyB, cardW, cardH, { fill: this.C_WHITE, stroke: cor, lw: 1.2, radius: 5 });
            this._circle(doc, cx + 16, cyB + cardH / 2, 10, { fill: cor });
            this._line(doc, cx + 11, cyB + cardH / 2, cx + 21, cyB + cardH / 2, { color: this.C_WHITE, lw: 1.5 });
            const tx = cx + 30;
            this._text(doc, this.FB, 7, tx, cyB + cardH - 12, label, { color: cor, bold: true });
            this._text(doc, this.FB, 11, tx, cyB + 8, valor, { color: this.C_NAVY, bold: true });
        });
    }

    _drawRodape(doc, ml, mr, pw, ph) {
        const yV = this.MB + this.NUM_PAG_H + 4;
        const cx = pw / 2;

        const yLinha = yV + 34;
        this._line(doc, ml, yLinha, pw - mr, yLinha, { color: this.C_GOLD, lw: 0.8 });

        this._text(doc, this.FB, 8, cx, yV + 24, "2 Corintios 9:7", { color: this.C_NAVY, center: true, bold: true });
        this._text(doc, this.FI, 7, cx, yV + 13,
            "\"Cada um de conforme determinou em seu coracao,",
            { color: this.C_NAVY, center: true, italic: true });
        this._text(doc, this.FI, 7, cx, yV + 3,
            "nao com pesar ou por obrigacao, pois Deus ama quem da com alegria.\"",
            { color: this.C_NAVY, center: true, italic: true });

        const assinH = this.ASSIN_H;
        const assinW = (pw - ml - mr - 12) / 3;
        const assinY = yLinha + 4;

        const labels = ["CAIXA / CARIMBO", "VISTO / ASSINATURA 1", "VISTO / ASSINATURA 2"];
        const sublabels = ["", "Responsavel pelo Caixa", "Conferido por"];

        labels.forEach((lbl, i) => {
            const sub = sublabels[i];
            const ax = ml + i * (assinW + 6);
            this._rect(doc, ax, assinY, assinW, assinH, { fill: [250, 250, 252], stroke: this.C_NAVY, lw: 0.5, radius: 3 });
            this._text(doc, this.FB, 7, ax + assinW / 2, assinY + assinH - 9, lbl, { color: this.C_NAVY2, center: true, bold: true });
            if (sub) {
                const sigY = assinY + 14;
                this._line(doc, ax + 8, sigY, ax + assinW - 8, sigY, { color: this.C_DGRAY, lw: 0.4 });
                this._text(doc, this.FN, 6.5, ax + assinW / 2, sigY - 9, sub, { color: this.C_DGRAY, center: true });
            }
        });
    }

    // ════════════════════════════════════════════════════════════════════
    // PRIMITIVAS (convertem coordenadas "a partir da base" para jsPDF)
    // ════════════════════════════════════════════════════════════════════

    _toJsY(yFromBottom) { return this.PAGE_H - yFromBottom; }

    _rect(doc, x, y, w, h, opts = {}) {
        const jsY = this._toJsY(y + h);
        let style = "";
        if (opts.fill) { doc.setFillColor(...opts.fill); style += "F"; }
        if (opts.stroke) { doc.setDrawColor(...opts.stroke); doc.setLineWidth(opts.lw || 0.5); style += "D"; }
        if (!style) style = "F";
        if (opts.radius) {
            doc.roundedRect(x, jsY, w, h, opts.radius, opts.radius, style);
        } else {
            doc.rect(x, jsY, w, h, style);
        }
    }

    _circle(doc, cx, cy, r, opts = {}) {
        const jsY = this._toJsY(cy);
        let style = "";
        if (opts.fill) { doc.setFillColor(...opts.fill); style += "F"; }
        if (opts.stroke) { doc.setDrawColor(...opts.stroke); doc.setLineWidth(opts.lw || 0.5); style += "D"; }
        if (!style) style = "F";
        doc.circle(cx, jsY, r, style);
    }

    _line(doc, x1, y1, x2, y2, opts = {}) {
        doc.setDrawColor(...(opts.color || this.C_BLACK));
        doc.setLineWidth(opts.lw || 0.5);
        doc.line(x1, this._toJsY(y1), x2, this._toJsY(y2));
    }

    _text(doc, font, size, x, y, text, opts = {}) {
        doc.setFont("helvetica", opts.bold ? "bold" : (opts.italic ? "italic" : "normal"));
        doc.setFontSize(size);
        doc.setTextColor(...(opts.color || this.C_BLACK));
        const align = opts.center ? "center" : (opts.right ? "right" : "left");
        doc.text(String(text), x, this._toJsY(y), { align });
    }

    _fmtMoeda(v) {
        try {
            const num = parseFloat(v) || 0;
            const fixed = num.toFixed(2);
            const [intPart, decPart] = fixed.split(".");
            const withThousands = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return `${withThousands},${decPart}`;
        } catch (e) { return "0,00"; }
    }
}

// ========== ui.js ==========
// ══════════════════════════════════════════════════════════════════════════
// UI.JS — componentes reutilizaveis (equivalentes aos widgets do Kivy)
// ══════════════════════════════════════════════════════════════════════════

// ── TOAST ────────────────────────────────────────────────────────────────
const Toast = {
    _timer: null,
    show(msg, cls) {
        let el = document.getElementById("toast");
        if (!el) {
            el = document.createElement("div");
            el.id = "toast";
            document.body.appendChild(el);
        }
        el.className = "toast " + cls;
        el.textContent = msg;
        el.style.display = "block";
        clearTimeout(this._timer);
        this._timer = setTimeout(() => { el.style.display = "none"; }, 2200);
    },
    ok(msg) { this.show("OK  " + msg, "ok"); },
    erro(msg) { this.show("X  " + msg, "err"); },
};

// ── NAV BAR ──────────────────────────────────────────────────────────────
function renderNavBar(ativo) {
    const items = [["HOME", "home"], ["DEP.", "cx_dep"], ["GERAL", "cx_geral"], ["PDF", "pdf"]];
    return `<div class="nav-bar">${items.map(([label, nome]) =>
        `<button class="${ativo === nome ? "active" : ""}" data-nav="${nome}">${label}</button>`
    ).join("")}</div>`;
}

// ── SECTION HEADER ───────────────────────────────────────────────────────
function renderSectionHeader(title, colorVar) {
    return `<div class="section-header" style="background:${_bgTint(colorVar)};color:${colorVar}">${escapeHtml(title)}</div>`;
}
function _bgTint(colorCss) {
    // aplica um tint escuro por trás do texto (equivalente a color*0.22 no Kivy)
    const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(colorCss);
    if (!m) return "rgba(255,255,255,0.08)";
    const [r, g, b] = [m[1], m[2], m[3]].map(Number);
    return `rgba(${Math.round(r*0.22)}, ${Math.round(g*0.22)}, ${Math.round(b*0.22)}, 1)`;
}

// ── ENTRY ROW ────────────────────────────────────────────────────────────
function _tagEntrada(e) {
    if (e.fixed_id) return "FIXO";
    if (e.payment_type === "pix") return "PIX";
    if (e.payment_type === "dinheiro") return "DIN";
    if (e.dep) return "DEP";
    return "";
}
function _tagSaida(e) {
    if (e.fixed_id) return "FIXO";
    if (e.auto_dep) return "AUTO";
    return "";
}
function _bgClassEntrada(e) {
    if (e.fixed_id) return "bg-fixo-ent";
    if (e.payment_type === "pix") return "bg-pix";
    if (e.dep) return "bg-dep";
    return "bg-card";
}
function _bgClassSaida(e) {
    if (e.fixed_id) return "bg-fixo-sai";
    if (e.auto_dep) return "bg-auto";
    return "bg-card";
}

function renderEntryRow(e, showEdit = true) {
    const isEnt = e.type === "entrada";
    const tag = isEnt ? _tagEntrada(e) : _tagSaida(e);
    const bgClass = isEnt ? _bgClassEntrada(e) : _bgClassSaida(e);
    const sinal = isEnt ? "+" : "-";
    const valClass = isEnt ? "ent" : "sai";
    const tagStr = tag ? `  ${tag}` : "";
    const editBtn = showEdit
        ? `<button class="btn-edit" data-action="editar-entry" data-id="${e.id}">Ed</button>`
        : `<div class="entry-spacer"></div>`;
    return `
    <div class="entry-row ${bgClass}">
        <div class="entry-info">
            <div class="entry-desc">${escapeHtml(e.desc)}</div>
            <div class="entry-sub">${escapeHtml(e.date)}${escapeHtml(tagStr)}</div>
        </div>
        <div class="entry-value ${valClass}">${sinal}${formatarMoeda(e.value)}</div>
        ${editBtn}
    </div>`;
}

function renderDepGrupoRow(entrada, saida) {
    let html = "";
    if (entrada) html += renderEntryRow(entrada, true);
    if (saida) html += renderEntryRow(saida, false);
    return html;
}

// ── PAINEL EXPANSIVEL (accordion) ───────────────────────────────────────
let _painelCounter = 0;
function renderPainelExpansivel(id, titulo, colorCss, innerHtml, startOpen = false) {
    return `
    <div class="painel" id="painel-${id}">
        <button class="painel-hdr" style="background:${_bgTint(colorCss)};color:${colorCss}"
                data-action="toggle-painel" data-painel="${id}">
            [${startOpen ? "-" : "+"}]  ${escapeHtml(titulo)}
        </button>
        <div class="painel-content ${startOpen ? "open" : ""}" id="painel-content-${id}">
            <div class="painel-content-inner">${innerHtml}</div>
        </div>
    </div>`;
}

function togglePainel(id) {
    const content = document.getElementById(`painel-content-${id}`);
    const hdr = document.querySelector(`#painel-${id} .painel-hdr`);
    if (!content) return;
    const isOpen = content.classList.toggle("open");
    if (hdr) {
        hdr.textContent = hdr.textContent.replace(/\[.\]/, isOpen ? "[-]" : "[+]");
    }
}

// ── VALIDAÇÃO (equivalente a _validar) ──────────────────────────────────
function validarLancamento(desc, val, dataStr) {
    if (!desc) return { ok: false, msg: "Descricao nao pode estar vazia." };
    if (val <= 0) return { ok: false, msg: "Valor deve ser maior que zero." };
    if (!dataValida(dataStr)) return { ok: false, msg: "Data incompleta (AAAA-MM-DD)." };
    return { ok: true, msg: "" };
}

// ── Helpers de formulario: mascara de valor e data em inputs ────────────
function attachValorMask(input) {
    input.addEventListener("input", () => {
        let raw = input.value.replace(/\./g, "").replace(",", "C");
        let digitsOnly = "", hasDecimal = false, decimalPart = "";
        for (const ch of raw) {
            if (/\d/.test(ch)) {
                if (hasDecimal) { if (decimalPart.length < 2) decimalPart += ch; }
                else digitsOnly += ch;
            } else if (ch === "C" && !hasDecimal) {
                hasDecimal = true;
            }
        }
        if (!digitsOnly && !hasDecimal) { return; }
        let inteiro;
        try { inteiro = parseInt(digitsOnly || "0", 10); } catch (e) { inteiro = 0; }
        let inteiroFmt = String(inteiro).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        const formatted = hasDecimal ? `${inteiroFmt},${decimalPart}` : inteiroFmt;
        if (formatted !== input.value) input.value = formatted;
    });
}
function getValorFromInput(input) {
    try {
        return parseFloat(input.value.replace(/\./g, "").replace(",", ".")) || 0;
    } catch (e) { return 0; }
}
function setValorInput(input, value) {
    if (value === null || typeof value === "undefined" || value === "") { input.value = ""; return; }
    const fixed = Number(value).toFixed(2);
    const [intPart, decPart] = fixed.split(".");
    input.value = `${intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".")},${decPart}`;
}

function attachDataMask(input) {
    input.addEventListener("input", () => {
        let digits = input.value.replace(/\D/g, "").slice(0, 8);
        let formatted = digits;
        if (digits.length > 4 && digits.length <= 6) formatted = `${digits.slice(0,4)}-${digits.slice(4)}`;
        else if (digits.length > 6) formatted = `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6)}`;
        input.value = formatted;
    });
}
function setDataInput(input, dataStr) {
    input.value = dataStr || "";
}

// APP.JS — controlador principal (equivalente a CaixaApp + todas as Screens)
// ══════════════════════════════════════════════════════════════════════════

const App = {
    svc: null,
    screen: "home",
    params: {},

    async init() {
        await DataStore.init();
        this.svc = new FinanceService(DataStore.load());
        await migrarDadosLegados(this.svc);
        await this.svc.ensureFixedEntries(chaveAtual());
        this._wireDelegation();
        this.navigateTo("home");
    },

    navigateTo(name, params = {}) {
        this.screen = name;
        this.params = params;
        this.render();
        const content = document.getElementById("app-content");
        if (content) content.scrollTop = 0;
    },

    refreshCurrent() {
        this.render();
    },

    abrirMes(chave, destino) {
        this.navigateTo(destino, { chave });
    },

    abrirRelatorio(chave, origem = "home") {
        this.navigateTo("relatorio", { chave, origem });
    },

    render() {
        const el = document.getElementById("app-content");
        switch (this.screen) {
            case "home": el.innerHTML = Screens.home(); break;
            case "cx_dep": el.innerHTML = Screens.mesList(true, false, "CX. DEPARTAMENTO", "cx_dep"); break;
            case "cx_geral": el.innerHTML = Screens.mesList(false, true, "CX. GERAL", "cx_geral"); break;
            case "cx_dep_mes": el.innerHTML = Screens.mesDetalheDep(this.params.chave); break;
            case "cx_geral_mes": el.innerHTML = Screens.mesDetalheGeral(this.params.chave); break;
            case "relatorio": el.innerHTML = Screens.relatorio(this.params.chave, this.params.origem); break;
            case "config": el.innerHTML = Screens.config(); break;
            case "pdf": el.innerHTML = Screens.pdf(); break;
            default: el.innerHTML = Screens.home();
        }
        this._afterRender();
    },

    _afterRender() {
        // Ativa paineis expansiveis "Cultos do Mes" já abertos por padrao? Nao;
        // comeca fechado como no original (_aberto = False).
        document.querySelectorAll(".valor-input").forEach(attachValorMask);
        document.querySelectorAll(".data-input").forEach(attachDataMask);
    },

    // ── Delegação de eventos global (equivalente aos on_release do Kivy) ──
    _wireDelegation() {
        document.getElementById("app").addEventListener("click", async (ev) => {
            const navEl = ev.target.closest("[data-nav]");
            if (navEl) { this.navigateTo(navEl.dataset.nav); return; }

            const painelEl = ev.target.closest("[data-action='toggle-painel']");
            if (painelEl) { togglePainel(painelEl.dataset.painel); return; }

            const editEl = ev.target.closest("[data-action='editar-entry']");
            if (editEl) { Modals.editar(editEl.dataset.id); return; }

            const abrirMesEl = ev.target.closest("[data-action='abrir-mes']");
            if (abrirMesEl) { this.abrirMes(abrirMesEl.dataset.chave, abrirMesEl.dataset.destino); return; }

            const relEl = ev.target.closest("[data-action='abrir-relatorio']");
            if (relEl) { this.abrirRelatorio(relEl.dataset.chave, relEl.dataset.origem || "home"); return; }

            const editCultoEl = ev.target.closest("[data-action='editar-culto']");
            if (editCultoEl) {
                Modals.editarCulto(editCultoEl.dataset.chaveMes, editCultoEl.dataset.cultoKey);
                return;
            }

            const gerarPdfEl = ev.target.closest("[data-action='gerar-pdf']");
            if (gerarPdfEl) { await Screens.gerarPDF(gerarPdfEl.dataset.chave); return; }

            const abrirModalEl = ev.target.closest("[data-action]");
            if (abrirModalEl) {
                const action = abrirModalEl.dataset.action;
                if (Modals[action]) { Modals[action](abrirModalEl.dataset); return; }
            }
        });
    },
};

        const destino = depOnly ? "cx_dep_mes" : "cx_geral_mes";
        let listaHtml = "";
        if (!chaves.length) {
            listaHtml = `<div class="muted-msg">Nenhum caixa ainda.</div>`;
        } else {
            for (const chave of [...chaves].reverse()) {
                let sal;
                if (depOnly) {
                    const entries = svc.getMonthData(chave, true);
                    const ent = entries.filter(e => e.type === "entrada").reduce((s,e)=>s+e.value,0);
                    const sai = entries.filter(e => e.type === "saida").reduce((s,e)=>s+e.value,0);
                    sal = ent - sai;
                } else {
                    sal = svc.calculateBalance(chave, true)[2];
                }
                const cor = sal >= 0 ? "var(--green)" : "var(--red)";
                listaHtml += `
                <button class="mes-btn" data-action="abrir-mes" data-chave="${chave}" data-destino="${destino}">
                    <span>${escapeHtml(formatarChave(chave))}</span>
                    <span class="saldo" style="color:${cor}">${formatarMoeda(sal)}</span>
                </button>`;
            }

        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="home">VOLTAR</button>
            <h1>${escapeHtml(titulo)}</h1>
        </div>
        <div class="scroll">${listaHtml}</div>

    },

    mesDetalheGeral(chaveParam) {
        const svc = App.svc;
        const chave = chaveParam || chaveAtual();
        let anoC, mesC;
        try { anoC = parseInt(chave.slice(0,4),10); mesC = parseInt(chave.slice(5),10); }
        catch (e) { const t = new Date(); anoC = t.getFullYear(); mesC = t.getMonth()+1; }

        const geral = svc.getGeralData(chave);
        const ents = svc.sortEntries(geral.filter(e => e.type === "entrada"));
        const sais = svc.sortExpenses(geral.filter(e => e.type === "saida"));
        const [entT, saiT, sal] = svc.calculateBalance(chave, true);
        const repasse = svc.calculateRepasse(chave);

        const ini = inicioCaixa(anoC, mesC), fim = fimCaixa(anoC, mesC);
        const corS = sal >= 0 ? "var(--green)" : "var(--red)";
        const corR = repasse >= 0 ? "var(--green)" : "var(--red)";

        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="cx_geral">VOLTAR</button>
            <div class="hdr-info"><h1>CX. GERAL</h1><div class="sub">${escapeHtml(formatarChave(chave))}</div></div>
        </div>
        <div class="scroll">
            <div class="small-note">${_fmtDataBr(ini)} — ${_fmtDataBr(fim)}</div>
            <div class="card" style="margin-top:4px">
                <div class="linha-painel"><span>Entrada</span><span style="color:var(--green)">${formatarMoeda(entT)}</span></div>
                <div class="separador"></div>
                <div class="linha-painel"><span>Saida</span><span style="color:var(--red)">-${formatarMoeda(saiT)}</span></div>
                <div class="separador"></div>
                <div class="linha-painel bold"><span>Saldo</span><span style="color:${corS}">${formatarMoeda(sal)}</span></div>
                <div class="separador gold"></div>
                <div class="linha-painel bold"><span>Repasse</span><span style="color:${corR}">${formatarMoeda(repasse)}</span></div>
            </div>
            <div style="margin-top:6px">
                ${ents.length ? ents.map(e => renderEntryRow(e, true)).join("") : `<div class="muted-msg">Nenhuma entrada.</div>`}
            </div>
            <div class="separador" style="margin:8px 0"></div>
            <div>
                ${sais.length ? sais.map(e => renderEntryRow(e, true)).join("") : `<div class="muted-msg">Nenhuma despesa.</div>`}
            </div>
            ${Screens._painelCultos(anoC, mesC)}
        </div>
        ${renderNavBar("cx_geral")}`;
    },

    mesDetalheDep(chaveParam) {
        const svc = App.svc;
        const chave = chaveParam || chaveAtual();
        const grupos = svc.getDepGrupos(chave);
        const entries = svc.getMonthData(chave, true);
        const entT = entries.filter(e => e.type === "entrada").reduce((s,e)=>s+e.value,0);
        const saiT = entries.filter(e => e.type === "saida").reduce((s,e)=>s+e.value,0);
        const sal = entT - saiT;
        const ano = parseInt(chave.slice(0,4),10), mes = parseInt(chave.slice(5),10);
        const ini = inicioCaixa(ano, mes), fim = fimCaixa(ano, mes);
        const corS = sal >= 0 ? "var(--green)" : "var(--red)";

        let gruposHtml;
        if (grupos.length) {
            gruposHtml = grupos.map(([entrada, saida], idx) => {
                const nomeGrp = entrada ? entrada.desc : (saida ? saida.desc : "-");
                return `
                ${idx > 0 ? `<div class="separador" style="margin:6px 0"></div>` : ""}
                <div class="grp-label">${escapeHtml(nomeGrp)}</div>
                ${renderDepGrupoRow(entrada, saida)}`;
            }).join("");
        } else {
            gruposHtml = `<div class="muted-msg">Nenhum lancamento neste periodo.</div>`;
        }

        return `
        <div class="hdr">
            <button class="btn-voltar" data-nav="cx_dep">VOLTAR</button>
            <div class="hdr-info"><h1>CX. DEPARTAMENTO</h1><div class="sub">${escapeHtml(formatarChave(chave))}</div></div>
        </div>
        <div class="scroll">
            <div class="small-note">${_fmtDataBr(ini)} — ${_fmtDataBr(fim)}</div>
            <div class="card" style="margin-top:4px">
                <div class="linha-painel"><span>Entrada</span><span style="color:var(--green)">${formatarMoeda(entT)}</span></div>
                <div class="separador"></div>
                <div class="linha-painel"><span>Saida</span><span style="color:var(--red)">-${formatarMoeda(saiT)}</span></div>
                <div class="separador"></div>
                <div class="linha-painel bold"><span>Saldo</span><span style="color:${corS}">${formatarMoeda(sal)}</span></div>
            </div>
            ${renderSectionHeader("LANCAMENTOS POR GRUPO", "rgb(59,130,245)")}
            ${gruposHtml}
        </div>
        ${renderNavBar("cx_dep")}`;
    },

    _painelCultos(ano, mes) {
        const cultos = App.svc.cultos.cultosDoMes(ano, mes);
        const chaveMes = `${ano}-${String(mes).padStart(2,"0")}`;
        let html = "";
        if (!cultos.length) {
            html = `<div class="muted-msg">Sem cultos.</div>`;
        } else {
            let prevDate = null;
            for (const c of cultos) {
                if (prevDate && (c.date - prevDate) / 86400000 > 3) html += `<div style="height:6px"></div>`;
                prevDate = c.date;
                const ehCeia = c.ceia, ehQuarta = c.tipo === "quarta";
                const bgClass = ehCeia ? "ceia-bg" : (ehQuarta ? "quarta-bg" : "culto-bg");
                const bg = ehCeia ? "var(--ceia-bg)" : (ehQuarta ? "rgb(18,26,51)" : "var(--culto-bg)");
                const corClass = ehCeia ? "ceia" : (ehQuarta ? "quarta" : "");
                html += `
                <div class="culto-row" style="background:${bg}">
                    <div class="culto-data">${_fmtDataCurta(c.date)}</div>
                    <div class="culto-nome ${corClass}">${escapeHtml(c.label_display)}</div>
                    ${!ehQuarta ? `<button class="btn-edit" style="width:30px;height:30px" data-action="editar-culto" data-chave-mes="${chaveMes}" data-culto-key="${c.key}">Ed</button>` : ""}
                </div>`;
            }
        }
        return renderPainelExpansivel(`cultos-${chaveMes}`, "Cultos do Mes", "var(--gold)".replace("var(--gold)","rgb(217,184,51)"), html);
    },
};

function _fmtDataBr(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function _fmtDataCurta(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
}

// SCREENS (cont.) — Relatorio, Config, PDF
// ══════════════════════════════════════════════════════════════════════════

Object.assign(Screens, {
    relatorio(chaveParam, origem = "home") {
        const svc = App.svc;
        const chave = chaveParam || chaveAtual();
        const entsAll = svc.sortEntries(svc.getMonthData(chave).filter(e => e.type === "entrada"));
        const saisAll = svc.sortExpenses(svc.getMonthData(chave).filter(e => e.type === "saida"));
        const [entT, saiT, sal] = svc.calculateBalance(chave, true);
        const repasse = svc.calculateRepasse(chave);

        const pixT = entsAll.filter(e => e.payment_type === "pix").reduce((s,e)=>s+e.value,0);
        const dinT = entsAll.filter(e => e.payment_type === "dinheiro").reduce((s,e)=>s+e.value,0);
        const depT = entsAll.filter(e => e.dep && !e.fixed_id).reduce((s,e)=>s+e.value,0);
        const fixT = entsAll.filter(e => e.fixed_id).reduce((s,e)=>s+e.value,0);
        const fixST = saisAll.filter(e => e.fixed_id).reduce((s,e)=>s+e.value,0);
        const depST = saisAll.filter(e => e.auto_dep).reduce((s,e)=>s+e.value,0);
        const manST = saisAll.filter(e => !e.fixed_id && !e.auto_dep).reduce((s,e)=>s+e.value,0);

        const ano = parseInt(chave.slice(0,4),10), mes = parseInt(chave.slice(5),10);
        const ini = inicioCaixa(ano, mes), fim = fimCaixa(ano, mes);
        const corSal = sal >= 0 ? "var(--green)" : "var(--red)";
        const corRep = repasse >= 0 ? "var(--green)" : "var(--red)";

        const linha = (label, valor, cor, bold=false) => `
            <div class="linha-painel ${bold ? "bold" : ""}"><span>${escapeHtml(label)}</span><span style="color:${cor}">${formatarMoeda(valor)}</span></div>`;

        let blocoEnt = "";
        if (pixT) blocoEnt += linha("  Pix", pixT, "rgb(102,191,255)");
        if (dinT) blocoEnt += linha("  Dinheiro", dinT, "var(--green)");
        if (depT) blocoEnt += linha("  Departamento", depT, "var(--accent)");
        if (fixT) blocoEnt += linha("  Fixos", fixT, "var(--gold)");
        blocoEnt += `<div class="separador"></div>` + linha("  TOTAL", entT, "var(--green)", true);

        let blocoSai = "";
        if (fixST) blocoSai += linha("  Fixas", fixST, "var(--gold)");
        if (depST) blocoSai += linha("  Auto-dep", depST, "var(--accent)");
        if (manST) blocoSai += linha("  Manuais", manST, "var(--red)");
